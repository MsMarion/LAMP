# Keeps secrets and project files from being downloaded.
# Used by the Docker image (Dockerfile) and on the droplet (docs/deploy.md step 3).
# Install it as zz-lamp-security.conf so it loads after Debian's security.conf,
# which would otherwise reset ServerTokens and ServerSignature.

# Hidden files and folders: .env, .git, .github, .gitignore, ...
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

# Project files that live in the repo but are not part of the website
<FilesMatch "(\.(sql|md|bru|yml|yaml|conf|ini|txt|bak|swp|swo|orig|save)|~|^Dockerfile)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/(sql|docs|bruno|apache)(/|$)">
    Require all denied
</DirectoryMatch>

# Don't advertise the Apache or OS version in headers and error pages
ServerTokens Prod
ServerSignature Off
