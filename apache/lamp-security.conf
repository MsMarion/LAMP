# Keeps secrets and project files from being downloaded.
# Used by the Docker image (Dockerfile) and on the droplet (docs/deploy.md step 3).

# Hidden files and folders: .env, .git, .github, .gitignore, ...
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

# Project files that live in the repo but are not part of the website
<FilesMatch "(\.(sql|md|bru|yml|yaml|conf|ini|txt|bak)|^Dockerfile)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/(sql|docs|bruno|apache)(/|$)">
    Require all denied
</DirectoryMatch>
