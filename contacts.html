<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacts | Contact Manager</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="images/favicon.svg"
    >

    <link
        rel="alternate icon"
        href="favicon.ico"
    >

    <!-- Custom Styles -->
    <link
        href="css/styles.css"
        rel="stylesheet"
    >

    <!-- Application JavaScript -->
    <script src="js/code.js"></script>
</head>


<body class="py-4 py-md-5">

    <div class="background-glow"></div>

    <main class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-10">

                <!-- Header -->
                <div
                    class="d-flex flex-column flex-md-row
                           align-items-center justify-content-between
                           mb-4 pb-3 border-bottom
                           border-secondary-subtle gap-3"
                >

                    <div class="d-flex align-items-center gap-3">

                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-journal-bookmark-fill"></i>
                        </div>

                        <div>
                            <h1 class="h3 fw-bold mb-1">
                                Your Contacts
                            </h1>

                            <span
                                id="userName"
                                class="small text-secondary-contrast"
                            >
                                Loading user...
                            </span>
                        </div>

                    </div>

                    <button
                        type="button"
                        id="logoutButton"
                        class="btn btn-outline-danger rounded-pill px-4"
                        onclick="doLogout();"
                    >
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Log Out
                    </button>

                </div>


                <!-- Search -->
                <div
                    class="card glass-card shadow-lg
                           border-0 p-4 mb-4"
                >

                    <div class="card-body p-0">

                        <h2 class="h5 fw-bold mb-3">
                            <i class="bi bi-search me-2"></i>
                            Search Contacts
                        </h2>

                        <form
                            id="searchForm"
                            onsubmit="event.preventDefault(); searchContact();"
                        >

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input
                                    type="text"
                                    id="searchText"
                                    class="form-control"
                                    placeholder="Search name, phone, email, address, or notes"
                                    autocomplete="off"
                                >

                                <button
                                    type="submit"
                                    class="btn btn-primary px-4"
                                >
                                    Search
                                </button>

                            </div>

                        </form>

                        <div class="mt-3">

                            <span
                                id="contactSearchResult"
                                class="small fw-semibold"
                                role="status"
                                aria-live="polite"
                            ></span>

                        </div>

                    </div>

                </div>


                <!-- Add Contact -->
                <div
                    class="card glass-card shadow-lg
                           border-0 p-4 mb-4"
                >

                    <div class="card-body p-0">

                        <h2 class="h5 fw-bold mb-4">
                            <i class="bi bi-person-plus me-2"></i>
                            Add Contact
                        </h2>

                        <form
                            id="addContactForm"
                            onsubmit="event.preventDefault(); addContact();"
                        >

                            <div class="row g-3">

                                <!-- Name -->
                                <div class="col-12 col-md-6">

                                    <label
                                        for="contactName"
                                        class="form-label"
                                    >
                                        Name
                                    </label>

                                    <input
                                        type="text"
                                        id="contactName"
                                        class="form-control"
                                        maxlength="100"
                                        required
                                    >

                                </div>


                                <!-- Phone -->
                                <div class="col-12 col-md-6">

                                    <label
                                        for="contactPhone"
                                        class="form-label"
                                    >
                                        Phone
                                    </label>

                                    <input
                                        type="tel"
                                        id="contactPhone"
                                        class="form-control"
                                        maxlength="30"
                                    >

                                </div>


                                <!-- Email -->
                                <div class="col-12 col-md-6">

                                    <label
                                        for="contactEmail"
                                        class="form-label"
                                    >
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        id="contactEmail"
                                        class="form-control"
                                        maxlength="255"
                                    >

                                </div>


                                <!-- Address -->
                                <div class="col-12 col-md-6">

                                    <label
                                        for="contactAddress"
                                        class="form-label"
                                    >
                                        Address
                                    </label>

                                    <input
                                        type="text"
                                        id="contactAddress"
                                        class="form-control"
                                        maxlength="255"
                                    >

                                </div>


                                <!-- Notes -->
                                <div class="col-12">

                                    <label
                                        for="contactNotes"
                                        class="form-label"
                                    >
                                        Notes
                                    </label>

                                    <textarea
                                        id="contactNotes"
                                        class="form-control"
                                        rows="3"
                                    ></textarea>

                                </div>


                                <div class="col-12">

                                    <button
                                        type="submit"
                                        id="addContactButton"
                                        class="btn btn-success px-4"
                                    >
                                        <i class="bi bi-plus-circle me-1"></i>
                                        Add Contact
                                    </button>

                                </div>

                            </div>

                        </form>

                        <div class="mt-3">

                            <span
                                id="contactAddResult"
                                class="small fw-semibold"
                                role="status"
                                aria-live="polite"
                            ></span>

                        </div>

                    </div>

                </div>


                <!-- Search Results -->
                <div
                    class="card glass-card shadow-lg
                           border-0 p-4"
                >

                    <div class="card-body p-0">

                        <div
                            class="d-flex align-items-center
                                   justify-content-between mb-3"
                        >

                            <h2 class="h5 fw-bold mb-0">
                                <i class="bi bi-people me-2"></i>
                                Search Results
                            </h2>

                            <span
                                id="contactCount"
                                class="badge text-bg-secondary"
                            >
                                0 contacts
                            </span>

                        </div>

                        <div
                            id="contactList"
                            class="row g-3"
                        >

                            <div class="col-12">

                                <p
                                    class="text-secondary text-center
                                           py-4 mb-0"
                                >
                                    Search for a contact to see results.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Edit Contact Modal -->
    <div
        class="modal fade"
        id="editContactModal"
        tabindex="-1"
        aria-labelledby="editContactModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h2
                        class="modal-title fs-5"
                        id="editContactModalLabel"
                    >
                        Edit Contact
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <div class="modal-body">

                    <form
                        id="editContactForm"
                        onsubmit="event.preventDefault(); saveContactEdit();"
                    >

                        <input
                            type="hidden"
                            id="editContactId"
                        >


                        <div class="row g-3">

                            <!-- Name -->
                            <div class="col-12 col-md-6">

                                <label
                                    for="editContactName"
                                    class="form-label"
                                >
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="editContactName"
                                    class="form-control"
                                    maxlength="100"
                                    required
                                >

                            </div>


                            <!-- Phone -->
                            <div class="col-12 col-md-6">

                                <label
                                    for="editContactPhone"
                                    class="form-label"
                                >
                                    Phone
                                </label>

                                <input
                                    type="tel"
                                    id="editContactPhone"
                                    class="form-control"
                                    maxlength="30"
                                >

                            </div>


                            <!-- Email -->
                            <div class="col-12 col-md-6">

                                <label
                                    for="editContactEmail"
                                    class="form-label"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="editContactEmail"
                                    class="form-control"
                                    maxlength="255"
                                >

                            </div>


                            <!-- Address -->
                            <div class="col-12 col-md-6">

                                <label
                                    for="editContactAddress"
                                    class="form-label"
                                >
                                    Address
                                </label>

                                <input
                                    type="text"
                                    id="editContactAddress"
                                    class="form-control"
                                    maxlength="255"
                                >

                            </div>


                            <!-- Notes -->
                            <div class="col-12">

                                <label
                                    for="editContactNotes"
                                    class="form-label"
                                >
                                    Notes
                                </label>

                                <textarea
                                    id="editContactNotes"
                                    class="form-control"
                                    rows="3"
                                ></textarea>

                            </div>

                        </div>


                        <div class="mt-3">

                            <span
                                id="contactEditResult"
                                class="small fw-semibold"
                                role="status"
                                aria-live="polite"
                            ></span>

                        </div>

                    </form>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="saveContactEdit();"
                    >
                        <i class="bi bi-save me-1"></i>
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function () {
                readCookie();
            }
        );
    </script>

</body>

</html>
