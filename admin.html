<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Contact Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">

    <link href="css/styles.css" rel="stylesheet">

    <script src="js/code.js"></script>
</head>

<body class="py-4 py-md-5">

    <div class="background-glow"></div>

    <main class="container">

        <!-- Header -->
        <div
            class="d-flex flex-column flex-md-row
                   align-items-center justify-content-between
                   mb-4 pb-3 border-bottom
                   border-secondary-subtle gap-3"
        >

            <div class="d-flex align-items-center gap-3">

                <div class="app-icon-wrapper-sm">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>

                <div>
                    <h1 class="h3 fw-bold mb-1">
                        Admin Dashboard
                    </h1>

                    <span
                        id="adminName"
                        class="small text-secondary-contrast"
                    >
                        Loading administrator...
                    </span>
                </div>

            </div>

            <button
                type="button"
                class="btn btn-outline-danger rounded-pill px-4"
                onclick="doLogout();"
            >
                <i class="bi bi-box-arrow-right me-1"></i>
                Log Out
            </button>

        </div>


        <!-- Create User -->
        <div class="card glass-card shadow-lg border-0 p-4 mb-4">

            <div class="card-body p-0">

                <h2 class="h5 fw-bold mb-4">
                    <i class="bi bi-person-plus-fill me-2"></i>
                    Create User or Administrator
                </h2>

                <form
                    id="adminCreateUserForm"
                    onsubmit="event.preventDefault(); adminCreateUser();"
                >

                    <div class="row g-3">

                        <div class="col-12 col-md-6">

                            <label
                                for="adminCreateFullName"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="adminCreateFullName"
                                class="form-control"
                                maxlength="100"
                                required
                            >

                        </div>


                        <div class="col-12 col-md-6">

                            <label
                                for="adminCreateUsername"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="adminCreateUsername"
                                class="form-control"
                                minlength="3"
                                maxlength="50"
                                required
                            >

                        </div>


                        <div class="col-12 col-md-6">

                            <label
                                for="adminCreatePassword"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="adminCreatePassword"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>


                        <div class="col-12 col-md-6">

                            <label
                                for="adminCreateRole"
                                class="form-label"
                            >
                                Role
                            </label>

                            <select
                                id="adminCreateRole"
                                class="form-select"
                                required
                            >
                                <option value="user">User</option>
                                <option value="admin">Administrator</option>
                            </select>

                        </div>


                        <div class="col-12">

                            <button
                                type="submit"
                                class="btn btn-success px-4"
                            >
                                <i class="bi bi-person-plus me-1"></i>
                                Create Account
                            </button>

                        </div>

                    </div>

                </form>

                <div class="mt-3">
                    <span
                        id="adminCreateResult"
                        class="small fw-semibold"
                        role="status"
                        aria-live="polite"
                    ></span>
                </div>

            </div>

        </div>


        <!-- User Management -->
        <div class="card glass-card shadow-lg border-0 p-4 mb-4">

            <div class="card-body p-0">

                <div
                    class="d-flex flex-column flex-md-row
                           justify-content-between gap-3 mb-4"
                >

                    <h2 class="h5 fw-bold mb-0">
                        <i class="bi bi-people-fill me-2"></i>
                        User Management
                    </h2>

                    <span
                        id="adminUserCount"
                        class="badge text-bg-secondary align-self-start"
                    >
                        0 users
                    </span>

                </div>


                <form
                    onsubmit="event.preventDefault(); adminSearchUsers();"
                >

                    <div class="input-group mb-3">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="adminUserSearch"
                            class="form-control"
                            placeholder="Search username, name, email, or role"
                        >

                        <button
                            type="submit"
                            class="btn btn-primary px-4"
                        >
                            Search
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="adminLoadAllUsers();"
                        >
                            All Users
                        </button>

                    </div>

                </form>


                <div class="mb-3">

                    <span
                        id="adminUserResult"
                        class="small fw-semibold"
                        role="status"
                        aria-live="polite"
                    ></span>

                </div>


                <div class="table-responsive">

                    <table
                        class="table table-dark table-hover align-middle"
                    >

                        <thead>

                            <tr>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Contacts</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="adminUserTable">

                            <tr>
                                <td
                                    colspan="6"
                                    class="text-center text-secondary py-4"
                                >
                                    Loading users...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- Global Contact Search -->
        <div class="card glass-card shadow-lg border-0 p-4 mb-4">

            <div class="card-body p-0">

                <div
                    class="d-flex flex-column flex-md-row
                           justify-content-between gap-3 mb-4"
                >

                    <h2 class="h5 fw-bold mb-0">
                        <i class="bi bi-journal-bookmark-fill me-2"></i>
                        All Contacts
                    </h2>

                    <span
                        id="adminContactCount"
                        class="badge text-bg-secondary align-self-start"
                    >
                        0 contacts
                    </span>

                </div>


                <form
                    onsubmit="event.preventDefault(); adminSearchContacts();"
                >

                    <div class="input-group mb-3">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="adminContactSearch"
                            class="form-control"
                            placeholder="Search contacts or contact owner"
                        >

                        <button
                            type="submit"
                            class="btn btn-primary px-4"
                        >
                            Search
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="adminLoadAllContacts();"
                        >
                            All Contacts
                        </button>

                    </div>

                </form>


                <div class="mb-3">

                    <span
                        id="adminContactResult"
                        class="small fw-semibold"
                        role="status"
                        aria-live="polite"
                    ></span>

                </div>


                <div
                    id="adminContactList"
                    class="row g-3"
                >

                    <div class="col-12">

                        <p class="text-center text-secondary py-4">
                            Loading contacts...
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Change Password Modal -->
    <div
        class="modal fade"
        id="adminPasswordModal"
        tabindex="-1"
        aria-labelledby="adminPasswordModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h2
                        class="modal-title fs-5"
                        id="adminPasswordModalLabel"
                    >
                        Change User Password
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="adminPasswordUserId"
                    >

                    <p class="mb-3">

                        Changing password for:

                        <strong id="adminPasswordUsername"></strong>

                    </p>

                    <label
                        for="adminNewPassword"
                        class="form-label"
                    >
                        New Password
                    </label>

                    <input
                        type="password"
                        id="adminNewPassword"
                        class="form-control"
                        minlength="8"
                    >

                    <div class="mt-3">

                        <span
                            id="adminPasswordResult"
                            class="small fw-semibold"
                            role="status"
                            aria-live="polite"
                        ></span>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="adminChangePassword();"
                    >
                        Change Password
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            initializeAdmin
        );
    </script>

</body>

</html>
